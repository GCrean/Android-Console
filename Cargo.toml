[package]
name = "android-console"
version = "0.1.0"
edition = "2024"
description = "Interactive ADB shell terminal for Android devices, built with GPUI"
authors = ["Android Console contributors"]

[dependencies]
async-channel = "2.5.0"
gpui = "0.2.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Installer configuration for cargo-packager (run from the repo root):
#   Windows: cargo packager --release --formats nsis
#   macOS:   cargo packager --release --formats dmg
#   Linux:   cargo packager --release --formats deb
[package.metadata.packager]
product-name = "Android Console"
identifier = "dev.androidconsole.app"
description = "Interactive ADB shell terminal for Android devices"
long-description = "A fast GPU-rendered terminal for `adb shell` with truecolor, scrollback, selection and wireless debugging support."
authors = ["Android Console contributors"]
category = "DeveloperTool"
out-dir = "dist"
binaries-dir = "target/release"
binaries = [{ path = "android-console", main = true }]
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/256x256.png",
  "assets/icons/512x512.png",
  "assets/icons/icon.icns",
  "assets/icons/icon.ico",
]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = ["adb", "libxkbcommon-x11-0", "libvulkan1"]

[profile.release]
strip = true
lto = "thin"

# xattr 0.2.3 (via gpui -> zed-async-tar) fails to build on Linux with libc >= 0.2.178
# because ENOATTR was removed there; vendored copy uses ENODATA instead.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
